name: debug-secret

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe worker paths
        env:
          CHECK_WORKER: ${{ secrets.DOMAIN }}
        run: |
          python - <<'PY'
          import os, requests
          u = os.environ.get("CHECK_WORKER", "")
          base = u.split("/check")[0]
          print("base:", base)
          for path in ["/", "/check", "/resolve?proxyip=socks5://1.1.1.1:1080"]:
              try:
                  r = requests.get(base + path, timeout=30)
                  body = r.text[:200].replace("\n", " ")
                  print(f"PATH {path} -> {r.status_code} | {r.headers.get('content-type')} | {body!r}")
              except Exception as e:
                  print(f"PATH {path} -> ERR {type(e).__name__} {str(e)[:120]}")
          try:
              r = requests.get(u + "1.1.1.1%3A443", timeout=30)
              print("CHECK ->", r.status_code, repr(r.text[:200]))
          except Exception as e:
              print("CHECK -> ERR", type(e).__name__, str(e)[:120])
          PY
